[project]
name = "cmart"
version = "0.1.0"
description = "CMART — API-first AI support agent"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CMART Team" }]

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic-settings==2.2.1",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.4",
    "structlog==24.2.0",
    "langchain==0.2.1",
    "langchain-text-splitters==0.2.0",
    "langchain-google-genai==1.0.8",
    "langchain-community==0.2.1",
    "openai==1.30.1",
    "pinecone==3.2.2",
    "html2text==2024.2.26",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-mock==3.14.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "locust==2.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmart"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
