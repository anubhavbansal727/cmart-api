# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment to use a timestamp-based file name scheme:
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate the slug (file name portion of the revision file name) to this length.
# Defaults to unlimited.
# truncate_slug_length = 40

# Set this to True if running in a multi-tenant context where the same
# alembic.ini is used across multiple databases.
# version_path_separator = os  # Use os.pathsep.

# The output encoding used when revision files are written from script.mako.
# output_encoding = utf-8

# sqlalchemy.url is intentionally left blank — set via DATABASE_URL env var in alembic/env.py
sqlalchemy.url =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly generated
# revision scripts. See the documentation for further detail and examples.

# Formatter hook using ruff to lint auto-generated files
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
